<!doctype html><html><body style="margin:0;background:#9cc6e8"><canvas id="c" style="width:100vw;height:100vh;display:block"></canvas>
<script type="module">
import * as THREE from "three";
import { buildPerson, buildPlayer, NPC_LOOKS } from "/src/game/characters.js";
const r = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
r.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9cc6e8);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(3, 6, 5); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0xcfd6dc })); floor.rotation.x = -Math.PI/2; scene.add(floor);
const people = [buildPlayer(), ...Object.values(NPC_LOOKS).map(buildPerson)];
people.forEach((p, i) => { p.position.x = (i - 3) * 0.95; scene.add(p); });
const q = new URLSearchParams(location.search);
if (q.get("walk")) people.forEach((p) => p.userData.walk(1.2, 1));
if (q.get("wave")) people[1].userData.wave(0.3);
if (q.get("press")) people[0].userData.press(1);
const cam = new THREE.PerspectiveCamera(q.get("close") ? 18 : 35, innerWidth / innerHeight, 0.1, 100);
if (q.get("close")) { const i = +q.get("close"); cam.position.set((i-3)*0.95, 1.65, 2.4); cam.lookAt((i-3)*0.95, 1.6, 0); }
else { cam.position.set(0, 1.5, 7.5); cam.lookAt(0, 1.0, 0); }
r.render(scene, cam);
let n = 0; r.info.autoReset = true; document.title = "calls " + r.info.render.calls;
</script></body></html>
