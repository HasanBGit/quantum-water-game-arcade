  <body>
    <div class="stage">
      <canvas id="scene" aria-label="3D view of a desalination plant. Walk with the arrow keys." tabindex="-1"></canvas>

      <header class="bar">
        <h1><span class="q">Quantum</span> Water</h1>
        <p id="hint" class="hint"></p>
      </header>

      <div class="controls" role="group">
        <button type="button" id="btn-settings" aria-expanded="false" aria-controls="settings-panel"></button>
        <div id="settings-panel" hidden>
          <button type="button" id="btn-overview" aria-pressed="false"></button>
          <button type="button" id="btn-pov" aria-pressed="false"></button>
          <button type="button" id="btn-sound" aria-pressed="false"></button>
          <button type="button" id="btn-click" aria-pressed="true"></button>
          <select id="quality"></select>
        </div>
        <button type="button" id="btn-words"></button>
      </div>

      <details id="bill" class="bill" open></details>
      <button type="button" id="btn-use" hidden></button>

      <div class="pad" role="group" aria-label="Walk">
        <button type="button" data-dir="up" aria-label="Walk up">&uarr;</button>
        <button type="button" data-dir="left" aria-label="Walk left">&larr;</button>
        <button type="button" data-dir="down" aria-label="Walk down">&darr;</button>
        <button type="button" data-dir="right" aria-label="Walk right">&rarr;</button>
      </div>

      <div id="flow"></div>
      <div id="toasts" aria-hidden="true"></div>

      <div id="loading" class="overlay" role="status">
        <p id="loading-text"></p>
        <progress id="loading-bar" max="100" value="0"></progress>
      </div>
      <div id="error" class="overlay" hidden>
        <p id="error-text"></p>
        <a id="error-link" href="./maths.html"></a>
      </div>
      <p id="status" class="sr-only" aria-live="polite"></p>
    </div>
    <noscript>
      <main style="max-width:760px;margin:0 auto;padding:24px;font-family:sans-serif;line-height:1.7">
        <h1>Quantum Water</h1>
        <p>Quantum Water is a free 3D browser game, created by <a href="/team.html">Hassan Barmandah</a>, that teaches Grover's quantum search. You run a desalination plant for a day, pick 3 of 5 time slots for the lowest electricity bill, then watch a simulated quantum search look for a cheaper plan. Everything quantum is simulated. The game needs JavaScript to run.</p>
        <ul>
          <li><a href="/team.html">The team</a></li>
          <li><a href="/maths.html">Maths check: the cost of all 32 plans</a></li>
        </ul>
      </main>
    </noscript>
    <script type="module" src="/src/game/main.js"></script>
  </body>
